<figure>
  <img
    [src]="photo().src"
    [alt]="photo().alt | localize: locale.current()"
    width="720"
    height="720"
    loading="lazy"
  />
  <figcaption>
    <span>{{ photo().caption | localize: locale.current() }}</span>
    <a
      [href]="photo().sourceUrl"
      target="_blank"
      rel="noopener noreferrer"
      [attr.aria-label]="('sports.viewPhoto' | translate) + ' — ' + ('common.external' | translate)"
    >
      {{ 'sports.viewPhoto' | translate }} <app-icon name="open_in_new" />
    </a>
  </figcaption>
</figure>
