<main id="main-content" class="container project-detail" tabindex="-1">
  <nav class="breadcrumbs">
    <a routerLink="/">{{ 'nav.home' | translate }}</a><span>/</span
    ><a routerLink="/projects">{{ 'nav.projects' | translate }}</a>@if(company();as employer){<span
      >/</span
    ><a routerLink="/work" [fragment]="employer.id">{{ employer.name }}</a>}
  </nav>
  @if(documentProject();as item) {
  <p class="eyebrow">{{ company()?.name || ('projects.project' | translate) }}</p>
  <app-document-content
    [title]="item.name"
    [description]="item.description | localize: locale.current()"
    [markdown]="item.markdown"
  />
  } @else {
  <h1>{{ 'common.notFound' | translate }}</h1>
  }
  <a class="pill back-link" routerLink="/projects">{{ 'projects.back' | translate }}</a>
</main>
