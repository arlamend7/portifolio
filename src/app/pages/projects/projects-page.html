<main id="main-content" class="container projects-page" tabindex="-1">
  <h1>{{ 'projects.title' | translate }}</h1>
  <p class="introduction">{{ 'projects.introduction' | translate }}</p>
  <div class="project-grid">
    @for(project of store.portfolio()?.projects;track project.id){<app-project-card
      [project]="project"
    />}
  </div>
</main>
