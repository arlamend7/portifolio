="405" y="115" width="325" height="140" rx="12" fill="var(--surface-card)" stroke="var(--border)"/><text x="567.5" y="160.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="var(--text)"><tspan x="567.5" dy="0">Módulos</tspan></text><text x="567.5" y="192.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="var(--text-muted)"><tspan x="567.5" dy="0">Com teste de fim de módulo</tspan><tspan x="567.5" dy="25">Sem teste · simulações</tspan></text><rect x="770" y="115" width="325" height="140" rx="12" fill="var(--surface-card)" stroke="var(--border)"/><text x="932.5" y="160.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="var(--text)"><tspan x="932.5" dy="0">Unidades</tspan></text><text x="932.5" y="192.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="var(--text-muted)"><tspan x="932.5" dy="0">Conteúdo agrupado</tspan><tspan x="932.5" dy="25">e prática</tspan></text><rect x="1135" y="115" width="325" height="140" rx="12" fill="var(--surface-card)" stroke="var(--border)"/><text x="1297.5" y="160.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="var(--text)"><tspan x="1297.5" dy="0">Atividades</tspan></text><text x="1297.5" y="192.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="var(--text-muted)"><tspan x="1297.5" dy="0">Um status cada</tspan><tspan x="1297.5" dy="25">por aluno e idioma</tspan></text><rect x="40" y="320" width="1420" height="130" rx="12" fill="var(--surface-card)" stroke="var(--border)"/><text x="750.0" y="360.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="var(--text)"><tspan x="750.0" dy="0">Tipos de atividade</tspan></text><text x="750.0" y="392.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="var(--text-muted)"><tspan x="750.0" dy="0">Múltipla escolha · Preencher lacunas · Arrastar e soltar · Cenas de diálogo</tspan><tspan x="750.0" dy="25">Ouvir e repetir · Quiz final · Atividades com IA</tspan></text><rect x="40" y="520" width="325" height="140" rx="12" fill="var(--surface-card)" stroke="var(--border)"/><text x="202.5" y="565.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="var(--text)"><tspan x="202.5" dy="0">Rastreamento SCORM</tspan></text><text x="202.5" y="597.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="var(--text-muted)"><tspan x="202.5" dy="0">Tentada, incompleta</tspan><tspan x="202.5" dy="25">ou concluída</tspan></text><rect x="405" y="520" width="325" height="140" rx="12" fill="var(--surface-card)" stroke="var(--border)"/><text x="567.5" y="565.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="var(--text)"><tspan x="567.5" dy="0">Status do módulo</tspan></text><text x="567.5" y="597.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="var(--text-muted)"><tspan x="567.5" dy="0">Não iniciado · em andamento</tspan><tspan x="567.5" dy="25">· concluído</tspan></text><rect x="770" y="520" width="325" height="140" rx="12" fill="var(--surface-card)" stroke="var(--border)"/><text x="932.5" y="565.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="var(--text)"><tspan x="932.5" dy="0">Conclusão do programa</tspan></text><text x="932.5" y="597.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="var(--text-muted)"><tspan x="932.5" dy="0">Aviso de conclusão</tspan><tspan x="932.5" dy="25">no idioma do aluno</tspan></text><rect x="1135" y="520" width="325" height="140" rx="12" fill="var(--surface-card)" stroke="var(--border)"/><text x="1297.5" y="565.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="var(--text)"><tspan x="1297.5" dy="0">Progresso e relatórios</tspan></text><text x="1297.5" y="597.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="var(--text-muted)"><tspan x="1297.5" dy="0">Visões do aluno</tspan><tspan x="1297.5" dy="25">e da equipe</tspan></text><rect x="40" y="710" width="1420" height="100" rx="12" fill="var(--surface-card)" stroke="var(--border)"/><text x="750.0" y="747.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="var(--text)"><tspan x="750.0" dy="0">Objetivos de projeto e testes</tspan></text><text x="750.0" y="779.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="var(--text-muted)"><tspan x="750.0" dy="0">Critérios WCAG 2.1 AA · inglês e francês · layout responsivo · testes por tipo</tspan></text><text x="750.0" y="850" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="var(--text-muted)"><tspan x="750.0" dy="0">Setas: estrutura e fluxo de status</tspan></text><text x="750.0" y="880" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="var(--text-muted)"><tspan x="750.0" dy="0">Visão conceitual; não representa modelo de dados nem implantação.</tspan></text></svg>