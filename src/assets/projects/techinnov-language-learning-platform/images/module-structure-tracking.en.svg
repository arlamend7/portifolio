I-assisted activities</tspan></text><rect x="40" y="520" width="325" height="140" rx="12" fill="var(--surface-card)" stroke="var(--border)"/><text x="202.5" y="565.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="var(--text)"><tspan x="202.5" dy="0">SCORM tracking</tspan></text><text x="202.5" y="597.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="var(--text-muted)"><tspan x="202.5" dy="0">Attempted, incomplete</tspan><tspan x="202.5" dy="25">or completed</tspan></text><rect x="405" y="520" width="325" height="140" rx="12" fill="var(--surface-card)" stroke="var(--border)"/><text x="567.5" y="565.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="var(--text)"><tspan x="567.5" dy="0">Module status</tspan></text><text x="567.5" y="597.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="var(--text-muted)"><tspan x="567.5" dy="0">Not started · in progress</tspan><tspan x="567.5" dy="25">· completed</tspan></text><rect x="770" y="520" width="325" height="140" rx="12" fill="var(--surface-card)" stroke="var(--border)"/><text x="932.5" y="565.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="var(--text)"><tspan x="932.5" dy="0">Program completion</tspan></text><text x="932.5" y="597.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="var(--text-muted)"><tspan x="932.5" dy="0">Completion notice</tspan><tspan x="932.5" dy="25">in the learner’s language</tspan></text><rect x="1135" y="520" width="325" height="140" rx="12" fill="var(--surface-card)" stroke="var(--border)"/><text x="1297.5" y="565.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="var(--text)"><tspan x="1297.5" dy="0">Progress and reports</tspan></text><text x="1297.5" y="597.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="var(--text-muted)"><tspan x="1297.5" dy="0">Learner and</tspan><tspan x="1297.5" dy="25"