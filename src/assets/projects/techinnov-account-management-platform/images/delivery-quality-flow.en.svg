<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 460"><title>Delivery and quality</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="var(--diagram-accent)"/></marker></defs><rect width="1500" height="460" rx="14" fill="var(--surface)"/><text x="750" y="48" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" fill="var(--text)">Delivery and quality</text><path d="M305 160h20" stroke="var(--diagram-accent)" stroke-width="3" marker-end="url(#arrow)"/><rect x="35" y="100" width="270" height="120" rx="12" fill="var(--surface-card)" stroke="var(--border)"/><text x="170" y="147" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="var(--text)">Understand the need</text><text x="170" y="183" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="var(--text)">Shared scope</text><path d="M595 160h20" stroke="var(--diagram-accent)" stroke-width="3" marker-end="url(#arrow)"/><rect x="325" y="100" width="270" height="120" rx="12" fill="var(--surface-card)" stroke="var(--border)"/><text x="460" y="147" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="var(--text)">Build the change</text><text x="460" y="183" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="var(--text)">Implementation</text><path d="M885 160h20" stroke="var(--diagram-accent)" stroke-width="3" marker-end="url(#arrow)"/><rect x="615" y="100" width="270" height="120" rx="12" fill="var(--surface-card)" stroke="var(--border)"/><text x="750" y="147" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="var(--text)">Review the code</text><text x="750" y="183" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="var(--text)">Peer review</text><path d="M1175 160h20" stroke="var(--diagram-accent)" stroke-width="3" marker-end="url(#arrow)"/><rect x="905" y="100" width="270" height="120" rx="12" fill="var(--surface-card)" stroke="var(--border)"/><text x="1040" y="147" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="var(--text)">Test the journeys</text><text x="1040" y="183" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="var(--text)">Manual + automated</text><rect x="1195" y="100" width="270" height="120" rx="12" fill="var(--surface-card)" stroke="var(--border)"/><text x="1330" y="147" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="var(--text)">Validate the result</text><text x="1330" y="183" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="var(--text)">Business validation</text><rect x="55" y="265" width="430" height="115" rx="12" fill="var(--surface-low)" stroke="var(--border)"/><text x="270" y="305" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="var(--text)">Evidence</text><text x="270" y="343" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="var(--text)">Record what was checked</text><rect x="535" y="265" width="430" height="115" rx="12" fill="var(--surface-low)" stroke="var(--border)"/><text x="750" y="305" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="var(--text)">Documentation</text><text x="750" y="343" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="var(--text)">Keep decisions understandable</text><rect x="1015" y="265" width="430" height="115" rx="12" fill="var(--surface-low)" stroke="var(--border)"/><text x="1230" y="305" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="var(--text)">Feedback</text><text x="1230" y="343" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="var(--text)">Investigate gaps and improve</text><text x="750" y="428" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="var(--text)">Conceptual workflow · not an internal operating procedure</text></svg>