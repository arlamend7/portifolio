<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" role="img"><title>Envoyer ne signifie pas livrer</title><rect width="1000" height="650" rx="16" fill="var(--surface)"/><g font-family="Arial, sans-serif"><text x="500" y="50" text-anchor="middle" font-size="28" fill="var(--text)"><tspan x="500" dy="0">Envoyer ne signifie pas livrer</tspan></text><rect x="50" y="125" width="210" height="185" rx="14" fill="var(--surface-low)" stroke="var(--border)"/><text x="155.0" y="165" text-anchor="middle" font-size="23" fill="var(--text)"><tspan x="155.0" dy="0">Notre système</tspan></text><rect x="125.0" y="200" width="60" height="40" rx="4" fill="none" stroke="var(--diagram-accent)" stroke-width="3"/><path d="M125.0 200 l30 24 30 -24" fill="none" stroke="var(--diagram-accent)" stroke-width="3"/><rect x="365" y="125" width="270" height="185" rx="14" fill="var(--surface-low)" stroke="var(--border)"/><text x="500.0" y="165" text-anchor="middle" font-size="23" fill="var(--text)"><tspan x="500.0" dy="0">SendGrid</tspan></text><rect x="470.0" y="200" width="60" height="40" rx="4" fill="none" stroke="var(--diagram-accent)" stroke-width="3"/><path d="M470.0 200 l30 24 30 -24" fill="none" stroke="var(--diagram-accent)" stroke-width="3"/><rect x="740" y="125" width="210" height="185" rx="14" fill="var(--surface-low)" stroke="var(--border)"/><text x="845.0" y="165" text-anchor="middle" font-size="23" fill="var(--text)"><tspan x="845.0" dy="0">Destinataire</tspan></text><rect x="815.0" y="200" width="60" height="40" rx="4" fill="none" stroke="var(--diagram-accent)" stroke-width="3"/><path d="M815.0 200 l30 24 30 -24" fill="none" stroke="var(--diagram-accent)" stroke-width="3"/><path d="M270 222 H350 m-10 -7 10 7 -10 7" fill="none" stroke="var(--diagram-accent)" stroke-width="3"/><path d="M645 222 H725 m-10 -7 10 7 -10 7" fill="none" stroke="var(--diagram-accent)" stroke-width="3"/><text x="180" y="347" text-anchor="middle" font-size="17" fill="var(--text-muted)"><tspan x="180" dy="0">Soumettre les messages</tspan></text><text x="500" y="347" text-anchor="middle" font-size="17" fill="var(--text-muted)"><tspan x="500" dy="0">Messages en attente de traitement</tspan></text><text x="845" y="347" text-anchor="middle" font-size="17" fill="var(--text-muted)"><tspan x="845" dy="0">Livraison</tspan></text><rect x="50" y="404" width="430" height="132" rx="12" fill="var(--surface-low)"/><rect x="50" y="404" width="5" height="132" rx="2" fill="var(--diagram-accent)"/><text x="265" y="456" text-anchor="middle" font-size="22" fill="var(--text)"><tspan x="265" dy="0">Plus de messages ne résorbent</tspan><tspan x="265" dy="26">pas les envois en attente.</tspan></text><rect x="520" y="404" width="430" height="132" rx="12" fill="var(--surface-low)"/><rect x="520" y="404" width="5" height="132" rx="2" fill="var(--diagram-accent)"/><text x="735" y="456" text-anchor="middle" font-size="22" fill="var(--text)"><tspan x="735" dy="0">Suspendre les nouveaux envois</tspan><tspan x="735" dy="26">ne vide pas la file existante.</tspan></text><text x="500" y="600" text-anchor="middle" font-size="18" fill="var(--text-muted)"><tspan x="500" dy="0">Analogie simplifiée : l’ordre et le délai de livraison peuvent varier.</tspan></text></g></svg>
