<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" role="img" aria-labelledby="t d">
  <title id="t">Filter first: same result, about 99% less time</title>
  <desc id="d">Before: join all tables, calculate fields for every row and filter at the end, so every step handles millions of rows. After: filter first and keep only the IDs for one page, then join and calculate for those rows only.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--diagram-accent)" /></marker>
  </defs>

  <rect width="900" height="640" fill="var(--surface)" />
  <g text-anchor="middle" font-family="Arial,Helvetica,sans-serif">
    <text x="450" y="58" font-size="32" font-weight="bold" fill="var(--text)">Filter first</text>
    <text x="450" y="90" font-size="13px" fill="var(--text-muted)">The colored bar shows how much data each step handles</text>

    <text x="225" y="140" font-size="22px" font-weight="bold" fill="var(--text)">Before</text>
    <text x="675" y="140" font-size="22px" font-weight="bold" fill="var(--text)">After</text>


    <rect x="45" y="160" width="360" height="70" rx="8" fill="var(--surface-low)" stroke="var(--border)" stroke-width="1.5" /><text x="225" y="190" font-size="16px" fill="var(--text)">Join all related tables</text>
    <rect x="65" y="206" width="320" height="10" rx="3" fill="var(--diagram-accent)" /><text x="225" y="246" font-size="13px" fill="var(--text-muted)">millions of rows</text>
    <line x1="225" y1="252" x2="225" y2="266" marker-end="url(#a)" stroke="var(--diagram-accent)" stroke-width="2.2" />
    <rect x="45" y="272" width="360" height="70" rx="8" fill="var(--surface-low)" stroke="var(--border)" stroke-width="1.5" /><text x="225" y="302" font-size="16px" fill="var(--text)">Calculate fields for every row</text>
    <rect x="65" y="318" width="320" height="10" rx="3" fill="var(--diagram-accent)" /><text x="225" y="358" font-size="13px" fill="var(--text-muted)">millions of rows</text>
    <line x1="225" y1="364" x2="225" y2="378" marker-end="url(#a)" stroke="var(--diagram-accent)" stroke-width="2.2" />
    <rect x="45" y="384" width="360" height="70" rx="8" fill="var(--surface-low)" stroke="var(--border)" stroke-width="1.5" /><text x="225" y="414" font-size="16px" fill="var(--text)">Filter by the search criteria</text>
    <rect x="65" y="430" width="320" height="10" rx="3" fill="var(--diagram-accent)" /><text x="225" y="470" font-size="13px" fill="var(--text-muted)">millions of rows</text>
    <line x1="225" y1="476" x2="225" y2="490" marker-end="url(#a)" stroke="var(--diagram-accent)" stroke-width="2.2" />
    <rect x="45" y="496" width="360" height="70" rx="8" fill="var(--surface-low)" stroke="var(--border)" stroke-width="1.5" /><text x="225" y="526" font-size="16px" fill="var(--text)">Return one page</text>
    <rect x="65" y="542" width="8" height="10" rx="3" fill="var(--diagram-accent)" /><text x="225" y="582" font-size="13px" fill="var(--text-muted)">one page of rows</text>


    <rect x="495" y="160" width="360" height="70" rx="8" fill="var(--surface-low)" stroke="var(--border)" stroke-width="1.5" /><text x="675" y="190" font-size="16px" fill="var(--text)">Filter by the search criteria</text>
    <rect x="515" y="206" width="320" height="10" rx="3" fill="var(--diagram-accent)" /><text x="675" y="246" font-size="13px" fill="var(--text-muted)">reads millions, keeps only matches</text>
    <line x1="675" y1="252" x2="675" y2="266" marker-end="url(#a)" stroke="var(--diagram-accent)" stroke-width="2.2" />
    <rect x="495" y="272" width="360" height="70" rx="8" fill="var(--surface-low)" stroke="var(--border)" stroke-width="1.5" /><text x="675" y="302" font-size="16px" fill="var(--text)">Keep only the IDs for one page</text>
    <rect x="515" y="318" width="8" height="10" rx="3" fill="var(--diagram-accent)" /><text x="675" y="358" font-size="13px" fill="var(--text-muted)">one page of IDs</text>
    <line x1="675" y1="364" x2="675" y2="378" marker-end="url(#a)" stroke="var(--diagram-accent)" stroke-width="2.2" />
    <rect x="495" y="384" width="360" height="70" rx="8" fill="var(--surface-low)" stroke="var(--border)" stroke-width="1.5" /><text x="675" y="414" font-size="16px" fill="var(--text)">Join related tables</text>
    <rect x="515" y="430" width="8" height="10" rx="3" fill="var(--diagram-accent)" /><text x="675" y="470" font-size="13px" fill="var(--text-muted)">one page of rows</text>
    <line x1="675" y1="476" x2="675" y2="490" marker-end="url(#a)" stroke="var(--diagram-accent)" stroke-width="2.2" />
    <rect x="495" y="496" width="360" height="70" rx="8" fill="var(--surface-low)" stroke="var(--border)" stroke-width="1.5" /><text x="675" y="526" font-size="16px" fill="var(--text)">Calculate fields</text>
    <rect x="515" y="542" width="8" height="10" rx="3" fill="var(--diagram-accent)" /><text x="675" y="582" font-size="13px" fill="var(--text-muted)">one page of rows</text>

    <rect x="160" y="598" width="580" height="34" rx="8" fill="var(--diagram-accent)" />
    <text x="450" y="621" font-size="16" font-weight="bold" fill="var(--diagram-on-accent)">Same data · about 99% less execution time in this case</text>
  </g>
</svg>
